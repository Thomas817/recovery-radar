name: Recovery Radar Daily Screening

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Anzahl Aktien für diesen Testlauf"
        required: false
        default: "15"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: recovery-radar-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Screening ausführen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}
        run: python scripts/screen.py --batch-size "$BATCH_SIZE"

      - name: Ergebnisse speichern
        run: |
          git config user.name "recovery-radar-bot"
          git config user.email "recovery-radar-bot@users.noreply.github.com"
          git add data/results.json data/history.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "chore: update recovery screening"
            git push
          fi
