name: Recovery Radar Daily Screening

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Anzahl Unternehmen in diesem manuellen Testlauf"
        required: true
        default: "3"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: recovery-radar-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Projektstruktur prüfen
        run: |
          test -f scripts/screen.py || { echo "::error::scripts/screen.py fehlt im Repository-Hauptverzeichnis."; exit 1; }
          test -f scripts/universe.json || { echo "::error::scripts/universe.json fehlt."; exit 1; }
          test -f data/results.json || { echo "::error::data/results.json fehlt."; exit 1; }
          echo "Projektstruktur ist vollständig."
      - name: API-Konfiguration prüfen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          if [ -z "$EODHD_API_KEY" ]; then
            echo "::error::Das Repository-Secret EODHD_API_KEY fehlt oder ist leer."
            exit 1
          fi
          echo "EODHD_API_KEY wurde gefunden (Länge: ${#EODHD_API_KEY})."
      - name: Screening ausführen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH_SIZE="${{ inputs.batch_size }}"
          else
            BATCH_SIZE="100"
          fi
          echo "Batch-Größe: $BATCH_SIZE"
          python scripts/screen.py --batch-size "$BATCH_SIZE"
      - name: Ergebnisse speichern
        run: |
          git config user.name "recovery-radar-bot"
          git config user.email "recovery-radar-bot@users.noreply.github.com"
          git add data/results.json data/history.json data/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "chore: update recovery screening"
            git push
          fi
