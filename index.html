<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recovery Radar</title><style>
:root{--bg:#07111f;--panel:#101d2e;--panel2:#14243a;--text:#edf4ff;--muted:#93a8c3;--accent:#48d7a0;--line:#263a53;--bad:#ff7c83}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;background:linear-gradient(145deg,#07111f,#0b1627);color:var(--text)}
header,main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:24px;align-items:end}
h1{font-size:clamp(30px,5vw,48px);margin:0;letter-spacing:-.04em}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.status,.muted{color:var(--muted)}.status{text-align:right}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;margin:12px 0 20px}
input,select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit}
button{cursor:pointer}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:18px}
.card{background:rgba(16,29,46,.95);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr.active{background:var(--panel2)}.score{font-size:20px;font-weight:850;color:var(--accent)}
.neg{color:var(--bad)}.pos{color:var(--accent)}.detail{padding:22px;position:sticky;top:12px}.detail h2{margin:.25rem 0 0;font-size:28px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.metric{background:var(--panel2);border-radius:12px;padding:12px}.metric b{display:block;font-size:18px}
canvas{width:100%;height:200px;background:#0b1728;border-radius:12px}.empty{padding:48px;text-align:center}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:12px}
@media(max-width:850px){header{align-items:start;flex-direction:column}.status{text-align:left}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}.detail{position:static}.table-wrap{overflow:auto}}
</style></head><body><header><div><div class="eyebrow">Investment Screening</div><h1>Recovery Radar</h1><div class="muted">Unterperformance erkennen. Erholungssignale prüfen.</div></div><div class="status" id="status">Daten werden geladen …</div></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Unternehmen oder Symbol suchen"><select id="country"><option value="">Alle Länder</option></select><select id="sector"><option value="">Alle Sektoren</option></select><button id="watchOnly">☆ Watchlist</button></div>
<div class="grid"><section class="card table-wrap"><table><thead><tr><th>Rang</th><th>Unternehmen</th><th>Score</th><th>3 Monate</th><th>Abstand Hoch</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden><h2>Noch keine Screening-Daten</h2><p class="muted">GitHub: Actions → Recovery Radar Daily Screening → Run workflow.</p></div></section><aside class="card detail" id="detail"><div class="muted">Wähle ein Unternehmen aus.</div></aside></div></main>
<script>
let all=[],filtered=[],selected=null,watch=new Set(JSON.parse(localStorage.getItem("rr-watch")||"[]")),watchMode=false;
const $=s=>document.querySelector(s.startsWith("#")?s:`#${s}`),fmt=n=>new Intl.NumberFormat("de-DE",{maximumFractionDigits:2}).format(n),pct=n=>`<span class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${fmt(n)}%</span>`;
async function load(){try{const r=await fetch(`data/results.json?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();all=d.results||[];$("#status").innerHTML=d.generatedAt?`Letztes Screening<br><b>${new Date(d.generatedAt).toLocaleString("de-DE")}</b><br>${d.screenedThisRun}/${d.requestedThisRun} im letzten Lauf`:"Noch kein Screening durchgeführt";fill();apply()}catch(e){$("#status").textContent="Daten konnten nicht geladen werden";$("#empty").hidden=false}}
function fill(){for(const[id,key]of[["country","country"],["sector","sector"]]){const v=[...new Set(all.map(x=>x[key]).filter(Boolean))].sort();$(id).innerHTML=`<option value="">Alle ${id==="country"?"Länder":"Sektoren"}</option>`+v.map(x=>`<option>${x}</option>`).join("")}}
function apply(){const q=$("#search").value.toLowerCase(),c=$("#country").value,s=$("#sector").value;filtered=all.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.symbol.toLowerCase().includes(q))&&(!c||x.country===c)&&(!s||x.sector===s)&&(!watchMode||watch.has(x.symbol)));render()}
function render(){$("#empty").hidden=all.length>0;$("#rows").innerHTML=filtered.map((x,i)=>`<tr data-symbol="${x.symbol}" class="${selected===x.symbol?'active':''}"><td>${i+1}</td><td><b>${watch.has(x.symbol)?"★ ":""}${x.name}</b><br><span class="muted">${x.symbol} · ${x.country}</span></td><td class="score">${fmt(x.score)}</td><td>${pct(x.performance["3m"])}</td><td>${pct(x.belowHigh52Pct)}</td></tr>`).join("");document.querySelectorAll("tbody tr").forEach(t=>t.onclick=()=>show(t.dataset.symbol));if(filtered.length&&(!selected||!filtered.some(x=>x.symbol===selected)))show(filtered[0].symbol)}
function show(s){selected=s;const x=all.find(v=>v.symbol===s);if(!x)return;document.querySelectorAll("tbody tr").forEach(t=>t.classList.toggle("active",t.dataset.symbol===s));$("#detail").innerHTML=`<span class="pill">${x.country} · ${x.sector}</span><h2>${x.name}</h2><div class="muted">${x.symbol} · Kursdatum ${x.asOf}</div><div class="metrics"><div class="metric"><span class="muted">Recovery Score</span><b class="score">${fmt(x.score)}</b></div><div class="metric"><span class="muted">Letzter Kurs</span><b>${fmt(x.price)}</b></div><div class="metric"><span class="muted">6 Monate</span><b>${pct(x.performance["6m"])}</b></div><div class="metric"><span class="muted">12 Monate</span><b>${pct(x.performance["12m"])}</b></div></div><canvas id="chart" width="600" height="220"></canvas><p>${x.explanation}</p><button id="toggleWatch">${watch.has(s)?"★ Von Watchlist entfernen":"☆ Zur Watchlist"}</button><p class="muted">Regelbasierte Vorauswahl; keine Anlageberatung.</p>`;draw(x.chart||[]);$("#toggleWatch").onclick=()=>{watch.has(s)?watch.delete(s):watch.add(s);localStorage.setItem("rr-watch",JSON.stringify([...watch]));render();show(s)}}
function draw(p){const c=$("#chart"),ctx=c.getContext("2d"),w=c.width,h=c.height,m=20;ctx.clearRect(0,0,w,h);if(p.length<2)return;const v=p.map(x=>x.close),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;ctx.strokeStyle="#48d7a0";ctx.lineWidth=3;ctx.beginPath();p.forEach((d,i)=>{const x=m+i*(w-2*m)/(p.length-1),y=h-m-(d.close-lo)*(h-2*m)/r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
["search","country","sector"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",apply));$("#watchOnly").onclick=()=>{watchMode=!watchMode;$("#watchOnly").textContent=watchMode?"★ Alle anzeigen":"☆ Watchlist";apply()};load();
</script></body></html>
